<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Đăng nhập')}"></head><body class="chinese-app"><a class="skip-link" href="#main">Đến nội dung chính</a><div class="nav-shade" id="nav-shade"></div><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div th:if="${notice}" class="messages" role="status"><div class="message success" th:text="${notice}"></div></div><main id="main"><section class="auth-layout wrap"><div class="auth-intro"><div class="overline">CHÀO MỪNG BẠN TRỞ LẠI</div><h1>Tiếp tục học.<br><em>Tiếp tục tiến bộ.</em></h1><p>Mọi bài học và kết quả của bạn đều ở đây.</p><span class="auth-star">✳</span></div><div class="panel auth-panel"><h2>Đăng nhập</h2><div class="message error" th:if="${param.error!=null}">Email, mật khẩu chưa đúng hoặc tài khoản chưa xác minh.</div><form method="post" th:action="@{/login}"><p><label>Email<input type="email" name="email" required maxlength="150" autocomplete="username"></label></p><p><label>Mật khẩu<input type="password" name="password" required autocomplete="current-password"></label></p><button class="button full">Đăng nhập ↗</button></form><div class="auth-links"><a href="/forgot-password">Quên mật khẩu?</a><a href="/resend">Gửi lại xác minh</a></div><p>Chưa có tài khoản? <a href="/register">Đăng ký ngay</a></p></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></div><script src="/portal.js" defer></script></body></html>
