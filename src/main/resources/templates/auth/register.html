<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Đăng ký')}"></head><body class="chinese-app"><a class="skip-link" href="#main">Đến nội dung chính</a><div class="nav-shade" id="nav-shade"></div><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div th:if="${notice}" class="messages" role="status"><div class="message success" th:text="${notice}"></div></div><main id="main"><section class="wrap section auth-narrow"><div class="panel auth-panel"><div class="overline">BƯỚC ĐẦU TIÊN CỦA BẠN</div><h1>Tạo tài khoản</h1><form method="post" th:action="@{/register}"><p><label>Họ tên<input name="name" required maxlength="150" autocomplete="name"></label></p><p><label>Email<input name="email" type="email" required maxlength="150" autocomplete="email"></label></p><p><label>Mật khẩu<input name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></label><small>Mật khẩu có ít nhất 8 ký tự.</small></p><p><label>Nhập lại mật khẩu<input name="confirm" type="password" required autocomplete="new-password"></label></p><p><label class="check-label"><input type="checkbox" name="consent" value="true" required>Tôi đã đọc <a href="/policies">điều khoản và chính sách dữ liệu</a>.</label></p><button class="button full">Tạo tài khoản ↗</button></form><p>Đã có tài khoản? <a href="/login">Đăng nhập</a></p></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></div><script src="/portal.js" defer></script></body></html>
