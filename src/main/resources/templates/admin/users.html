<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Quản lý tài khoản')}"></head><body class="chinese-app"><a class="skip-link" href="#main">Đến nội dung chính</a><div class="nav-shade" id="nav-shade"></div><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div th:if="${notice}" class="messages" role="status"><div class="message success" th:text="${notice}"></div></div><main id="main"><div class="portal-page"><a class="back" href="/admin">← Quản trị</a><h1>Tài khoản & phân quyền</h1><div class="table-wrap"><table><thead><tr><th>Học sinh</th><th>Xác minh</th><th>Cập nhật quyền</th></tr></thead><tbody><tr th:each="u:${users}"><td><strong th:text="${u.name}"></strong><br><small th:text="${u.email}"></small></td><td th:text="${u.verified?'Đã xác minh':'Chưa xác minh'}"></td><td><form class="inline-admin-form" method="post" th:action="@{/admin/users/{id}(id=${u.id})}"><select name="role"><option th:each="r:${T(vn.learnhub.user.Role).values()}" th:value="${r}" th:selected="${r==u.role}" th:text="${@fmt.role(r)}"></option></select><label class="check-label"><input type="checkbox" name="active" value="true" th:checked="${u.active}">Đang hoạt động</label><input name="reason" required placeholder="Lý do thay đổi"><button class="button small secondary">Lưu quyền</button></form></td></tr></tbody></table></div><p class="footnote">Khi đổi quyền hoặc trạng thái, người dùng cần đăng nhập lại. Luôn giữ ít nhất một tài khoản quản lý hoạt động.</p></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></div><script src="/portal.js" defer></script></body></html>
