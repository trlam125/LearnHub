<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Quản lý nội dung')}"></head><body class="chinese-app"><a class="skip-link" href="#main">Đến nội dung chính</a><div class="nav-shade" id="nav-shade"></div><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div th:if="${notice}" class="messages" role="status"><div class="message success" th:text="${notice}"></div></div><main id="main"><div class="portal-page"><a class="back" href="/admin">← Quản trị</a><div class="page-heading heading-with-action"><h1 th:text="${spec.title}"></h1><a class="button" th:href="@{/admin/content/{kind}/new(kind=${spec.key})}">＋ Thêm mới</a></div><div class="table-wrap"><table><thead><tr><th>Mã</th><th>Nội dung</th><th>Thao tác</th></tr></thead><tbody><tr th:each="row:${rows}"><td th:text="${row.id}"></td><td th:text="${adminTools.label(row)}"></td><td><a th:href="@{/admin/content/{kind}/{id}(kind=${spec.key},id=${row.id})}">Chỉnh sửa →</a></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="3">Chưa có nội dung.</td></tr></tbody></table></div><div class="admin-toolbar"><a th:if="${page>0}" th:href="@{/admin/content/{kind}(kind=${spec.key},page=${page-1})}">← Trang trước</a><a th:if="${#lists.size(rows)==50}" th:href="@{/admin/content/{kind}(kind=${spec.key},page=${page+1})}">Trang sau →</a></div><p class="footnote">Bỏ chọn “Xuất bản” trong phần chỉnh sửa để tạm ẩn nội dung.</p></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></div><script src="/portal.js" defer></script></body></html>
