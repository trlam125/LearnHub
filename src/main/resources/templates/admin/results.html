<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Bảng điểm')}"></head><body class="chinese-app"><a class="skip-link" href="#main">Đến nội dung chính</a><div class="nav-shade" id="nav-shade"></div><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div th:if="${notice}" class="messages" role="status"><div class="message success" th:text="${notice}"></div></div><main id="main"><div class="portal-page"><a class="back" href="/admin">← Quản trị</a><div class="page-heading heading-with-action"><h1>Kết quả bài tập</h1><a class="button" href="/admin/results.csv">Xuất CSV ↗</a></div><div class="table-wrap"><table><thead><tr><th>Email</th><th>Bài kiểm tra</th><th>Điểm /10</th><th>Ngày nộp</th></tr></thead><tbody><tr th:each="a:${attempts}"><td th:text="${a.user.email}"></td><td th:text="${a.quiz.title}"></td><td th:text="${a.score}"></td><td th:text="${@fmt.time(a.submittedAt)}"></td></tr></tbody></table></div><p class="footnote">CSV tối đa 10.000 lượt đã nộp gần nhất; giao diện hiển thị 100 lượt gần nhất.</p></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></div><script src="/portal.js" defer></script></body></html>
