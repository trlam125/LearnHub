<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Email và nhật ký')}"></head><body class="chinese-app"><a class="skip-link" href="#main">Đến nội dung chính</a><div class="nav-shade" id="nav-shade"></div><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div th:if="${notice}" class="messages" role="status"><div class="message success" th:text="${notice}"></div></div><main id="main"><div class="portal-page"><a class="back" href="/admin">← Quản trị</a><h1>Email &amp; lịch sử thay đổi</h1><h2>Email gần đây</h2><div class="table-wrap"><table><thead><tr><th>Mã</th><th>Người nhận</th><th>Tiêu đề</th><th>Số lần thử</th><th>Đã gửi</th></tr></thead><tbody><tr th:each="j:${jobs}"><td th:text="${j.id}"></td><td th:text="${j.recipient}"></td><td th:text="${j.subject}"></td><td th:text="${j.tries}"></td><td th:text="${@fmt.time(j.sentAt)}"></td></tr></tbody></table></div><h2 class="section">Nhật ký thay đổi</h2><div class="table-wrap"><table><thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Thao tác</th><th>Đối tượng / lý do</th></tr></thead><tbody><tr th:each="a:${audit}"><td th:text="${@fmt.time(a.createdAt)}"></td><td th:text="${a.actor!=null?a.actor.email:'Hệ thống'}"></td><td th:text="${@fmt.action(a.action)}"></td><td><strong th:text="${@fmt.target(a.target)}"></strong><br><span th:text="${@fmt.auditDetail(a.detail)}"></span></td></tr></tbody></table></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></div><script src="/portal.js" defer></script></body></html>
