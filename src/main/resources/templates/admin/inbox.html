<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Tư vấn và góp ý')}"></head><body class="chinese-app"><a class="skip-link" href="#main">Đến nội dung chính</a><div class="nav-shade" id="nav-shade"></div><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div th:if="${notice}" class="messages" role="status"><div class="message success" th:text="${notice}"></div></div><main id="main"><div class="portal-page"><a class="back" href="/admin">← Quản trị</a><h1>Tư vấn & góp ý</h1><h2>Yêu cầu tư vấn</h2><article class="panel inbox-card" th:each="c:${consultations}"><h3 th:text="${c.offering.title}+' · '+${c.name}"></h3><p><span th:text="${c.email}"></span> · <span th:text="${c.phone}"></span></p><p class="preline" th:text="${c.message}"></p><form class="inline-admin-form" method="post" th:action="@{/admin/inbox/consultations/{id}(id=${c.id})}"><select name="status"><option value="new" th:selected="${c.status=='new'}">Mới</option><option value="contacted" th:selected="${c.status=='contacted'}">Đã liên hệ</option><option value="closed" th:selected="${c.status=='closed'}">Đã xử lý</option></select><button class="button small secondary">Cập nhật</button></form></article><h2>Góp ý riêng tư</h2><article class="panel inbox-card" th:each="f:${feedback}"><h3 th:text="${f.user.email}+' · '+${f.rating}+'/5'"></h3><p class="preline" th:text="${f.message}"></p><form th:unless="${f.resolved}" method="post" th:action="@{/admin/inbox/feedback/{id}(id=${f.id})}"><button class="button small secondary">Đánh dấu đã xử lý</button></form><span th:if="${f.resolved}" class="pill">Đã xử lý</span></article></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></div><script src="/portal.js" defer></script></body></html>
