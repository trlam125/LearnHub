<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Chỉnh sửa nội dung')}"></head><body class="chinese-app"><a class="skip-link" href="#main">Đến nội dung chính</a><div class="nav-shade" id="nav-shade"></div><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div th:if="${notice}" class="messages" role="status"><div class="message success" th:text="${notice}"></div></div><main id="main"><div class="portal-page admin-form-page"><a class="back" th:href="@{/admin/content/{kind}(kind=${spec.key})}">← Danh sách</a><div class="page-heading"><h1 th:text="${spec.title}"></h1><p>Chỉ xuất bản sau khi kiểm tra nội dung và đáp án.</p></div><form class="panel admin-form" method="post" th:action="@{/admin/content/{kind}(kind=${spec.key})}"><input th:if="${entityId!=null}" type="hidden" name="entityId" th:value="${entityId}"><div class="admin-field" th:each="field:${inputs}"><label th:for="${field.name}" th:text="${field.label}"></label><input th:if="${field.type=='checkbox'}" type="checkbox" th:id="${field.name}" th:name="${field.name}" value="true" th:checked="${field.value==true}"><textarea th:if="${field.type=='textarea'}" th:id="${field.name}" th:name="${field.name}" rows="5" th:text="${field.value}" th:required="${field.required}"></textarea><input th:if="${field.type=='relation'}" type="search" placeholder="Tìm theo tên hoặc mã…" aria-label="Tìm mục liên kết" data-relation-search th:attr="data-target=${field.name},data-url=@{/admin/content/{kind}/options/{field}(kind=${spec.key},field=${field.name})}"><small th:if="${field.type=='relation'}" th:id="${field.name}+'-search-status'" role="status"></small><select th:if="${field.type=='select' or field.type=='relation'}" th:id="${field.name}" th:name="${field.name}" th:required="${field.required}"><option value="">— Chọn —</option><option th:each="option:${field.options}" th:value="${option.value}" th:selected="${option.value==field.value}" th:text="${option.label}"></option></select><input th:if="${field.type!='checkbox' and field.type!='textarea' and field.type!='select' and field.type!='relation'}" th:type="${field.type}" th:id="${field.name}" th:name="${field.name}" th:value="${field.value}" th:required="${field.required}" step="any"></div><button class="button">Lưu nội dung ✓</button></form><p class="footnote">Với bài kiểm tra, hãy lưu bản nháp, thêm câu hỏi và đáp án rồi mới công bố cho học viên.</p></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></div><script src="/portal.js" defer></script><script src="/admin.js" defer></script></body></html>
