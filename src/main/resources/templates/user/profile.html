<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Tài khoản và riêng tư')}"></head><body class="chinese-app"><a class="skip-link" href="#main">Đến nội dung chính</a><div class="nav-shade" id="nav-shade"></div><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div th:if="${notice}" class="messages" role="status"><div class="message success" th:text="${notice}"></div></div><main id="main"><div class="portal-page form-page"><div class="page-heading"><div class="overline">我的 · KHÔNG GIAN CÁ NHÂN</div><h1>Tài khoản & quyền riêng tư</h1><p th:text="${me.email}"></p></div><div class="panel auth-panel"><form method="post" th:action="@{/tai-khoan}"><p><label>Họ tên<input name="name" th:value="${me.name}" maxlength="150" required></label></p><p><label>Bí danh công khai<input name="publicName" th:value="${me.publicName}" maxlength="40"></label></p><p><label class="check-label"><input type="checkbox" name="rankingVisible" value="true" th:checked="${me.rankingVisible}">Tôi muốn xuất hiện trên bảng xếp hạng công khai.</label></p><button class="button full">Lưu thay đổi ✓</button></form><p class="footnote">Tên thật và email không hiển thị trên bảng xếp hạng. Tắt lựa chọn để ẩn bí danh và điểm.</p><a href="/forgot-password">Đặt lại mật khẩu →</a></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></div><script src="/portal.js" defer></script></body></html>
