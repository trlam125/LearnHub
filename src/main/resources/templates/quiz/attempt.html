<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Bài kiểm tra')}"></head><body class="chinese-app"><a class="skip-link" href="#main">Đến nội dung chính</a><div class="nav-shade" id="nav-shade"></div><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div th:if="${notice}" class="messages" role="status"><div class="message success" th:text="${notice}"></div></div><main id="main"><section class="wrap section narrow"><a class="back" th:href="@{/lessons/{id}(id=${attempt.quiz.lesson.id})}">← Về bài học</a><th:block th:if="${attempt.submittedAt!=null}"><div class="result-hero"><div class="overline">BẠN ĐÃ HOÀN THÀNH</div><h1 th:text="${attempt.quiz.title}"></h1><div class="result-score"><span th:text="${attempt.score}"></span><small>/10</small></div><span class="pill" th:text="${attempt.score.compareTo(attempt.passScore)>=0?'Đạt yêu cầu':'Hãy ôn tập và thử lại'}"></span><p th:text="'Nộp lúc '+${@fmt.time(attempt.submittedAt)}"></p></div><h2>Cùng xem lại bài làm</h2><section class="question panel" th:each="item,i:${result}"><span class="pill" th:text="${item.correct?'Đúng':'Chưa đúng'}+' · '+${item.points}+' điểm trọng số'"></span><h3 th:text="${i.count}+'. '+${item.question}"></h3><div class="answer-review" th:each="c:${item.choices}" th:classappend="${c.correct}?'right':''"><span th:text="${item.selected.contains(c.id)?'● ':'○ '}+${c.text}"></span><strong th:if="${c.correct}">✓ Đáp án đúng</strong></div><div class="explanation"><strong>Giải thích</strong><p class="preline" th:text="${item.explanation}"></p></div></section></th:block><th:block th:if="${attempt.submittedAt==null}"><div class="overline">TẬP TRUNG MỘT CHÚT NHÉ</div><h1 class="page-title" th:text="${attempt.quiz.title}"></h1><div class="quiz-toolbar"><span>Thời gian còn lại <strong id="timer" th:attr="data-remaining-millis=${remainingMillis}">Đang tính…</strong></span><span id="save-status" role="status">Tự lưu khi có thay đổi</span></div><p class="muted">Câu nhiều đáp án chỉ tính điểm khi chọn đúng toàn bộ. Hãy nộp bài trước khi hết giờ.</p><form method="post" id="quiz-form" th:action="@{/attempts/{id}(id=${attempt.id})}" th:attr="data-save-url=@{/attempts/{id}/save(id=${attempt.id})}"><fieldset class="question panel" th:each="q,i:${questions}" th:attr="data-question=${q.id}"><legend th:text="${i.count}+'. '+${q.text}"></legend><small th:text="${q.points}+' điểm trọng số · '+${q.kind=='multiple'?'Chọn nhiều đáp án':'Chọn một đáp án'}"></small><label class="answer" th:each="c:${q.choices}"><input th:type="${q.kind=='multiple'?'checkbox':'radio'}" th:name="'q'+${q.id}" th:value="${c.id}" th:checked="${c.selected}"><span th:text="${c.text}"></span></label></fieldset><div class="submit-bar"><small>Kiểm tra đáp án trước khi nộp.</small><button class="button" id="submit-quiz">Nộp bài & xem kết quả ↗</button></div></form></th:block></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></div><script src="/portal.js" defer></script><script src="/quiz.js" defer></script></body></html>
