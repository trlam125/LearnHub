<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Trò chơi học tập')}"></head><body class="chinese-app"><a class="skip-link" href="#main">Đến nội dung chính</a><div class="nav-shade" id="nav-shade"></div><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div th:if="${notice}" class="messages" role="status"><div class="message success" th:text="${notice}"></div></div><main id="main"><div class="portal-page"><section class="games-hero"><div><div class="overline">VỪA CHƠI VỪA HỌC</div><h1 th:text="${isEnglish?'Thử thách tiếng Anh mỗi ngày.':'Khám phá văn hóa Trung Quốc.'}"></h1><p>Chọn chủ đề, trả lời câu hỏi và xem lời giải.</p></div><span th:text="${languageSymbol}"></span></section><div class="topic-grid"><article class="topic-card" th:each="topic:${topics}"><span class="square-symbol" th:text="${topic.symbol}"></span><h2 th:text="${topic.title}"></h2><p th:text="${topic.description}"></p><div class="topic-meta" th:text="${topic.quiz.minutes}+' phút · Lưu lịch sử và điểm'"></div><form th:if="${me!=null}" method="post" th:action="@{/quizzes/{id}/start(id=${topic.quiz.id})}"><button class="button secondary full">Bắt đầu thử thách →</button></form><a th:if="${me==null}" class="button secondary full" href="/login">Đăng nhập để chơi →</a></article><div class="empty" th:if="${#lists.isEmpty(topics)}">Thử thách đang được chuẩn bị.</div></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></div><script src="/portal.js" defer></script></body></html>
