<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Từ vựng bài học')}"></head><body class="chinese-app"><a class="skip-link" href="#main">Đến nội dung chính</a><div class="nav-shade" id="nav-shade"></div><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div th:if="${notice}" class="messages" role="status"><div class="message success" th:text="${notice}"></div></div><main id="main"><div class="portal-page"><a class="back" th:href="@{/lessons/{id}(id=${lesson.id})}" th:text="'← '+${lesson.title}"></a><div class="page-heading heading-with-action"><div><div class="overline">TỪ VỰNG BÀI HỌC</div><h1>Hiểu từ. Nhớ lâu hơn.</h1><p th:text="${lesson.title}"></p></div><a class="button" th:href="@{/flashcards(lesson=${lesson.id})}">Học bằng flashcard ↗</a></div><div class="word-grid"><article class="word-card" th:each="word:${words}"><div class="word-top"><span class="word-hanzi" th:lang="${word.speechLanguage()}" th:text="${word.hanzi}"></span><button class="speak-button" th:attr="data-speak=${word.hanzi},data-audio=${word.audioUrl},data-language=${word.speechLanguage()}" aria-label="Nghe phát âm">♫</button></div><div class="word-pinyin" th:text="${word.pinyin}"></div><h3 th:text="${word.meaning}"></h3><small class="muted" th:if="${word.lesson.chapter.course.language=='zh'}" th:text="${word.sinoVietnamese}"></small><div class="word-example" th:if="${!word.exampleZh.isBlank()}"><p th:lang="${word.speechLanguage()}" th:text="${word.exampleZh}"></p><small th:text="${word.exampleVi}"></small></div><form th:if="${me!=null}" method="post" th:action="@{/tu-vung/{id}/luu(id=${word.id})}"><input type="hidden" name="saved" th:value="${saved.contains(word.id)?'0':'1'}"><button class="bookmark-button" th:classappend="${saved.contains(word.id)}?'is-saved':''" th:text="${saved.contains(word.id)?'✓ Đã lưu · Bỏ lưu':'＋ Lưu từ'}"></button></form><a th:if="${me==null}" href="/login" class="card-link">Đăng nhập để lưu từ →</a></article><div th:if="${#lists.isEmpty(words)}" class="empty">Giáo viên chưa đăng từ vựng cho bài này.</div></div><p class="footnote" id="speech-status" role="status">Nhấn nút nghe để luyện phát âm theo từng từ.</p></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></div><script src="/portal.js" defer></script><script src="/chinese.js" defer></script></body></html>
