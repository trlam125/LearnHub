<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Đăng ký tư vấn')}"></head><body class="chinese-app"><a class="skip-link" href="#main">Đến nội dung chính</a><div class="nav-shade" id="nav-shade"></div><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div th:if="${notice}" class="messages" role="status"><div class="message success" th:text="${notice}"></div></div><main id="main"><div class="portal-page form-page"><a class="back" href="/khoa-hoc">← Khóa học & lớp học</a><div class="page-heading"><div class="overline">CÙNG CHỌN LỘ TRÌNH</div><h1>Đăng ký tư vấn</h1><p th:text="${offering.title}+' · '+${offering.teacher.name}"></p></div><div class="panel auth-panel"><form method="post" th:action="@{/lop/{id}/tu-van(id=${offering.id})}"><p><label>Họ tên<input name="name" maxlength="120" required autocomplete="name"></label></p><p><label>Email<input name="email" type="email" maxlength="150" required autocomplete="email"></label></p><p><label>Điện thoại (không bắt buộc)<input name="phone" maxlength="30" autocomplete="tel"></label></p><p><label>Mục tiêu hoặc câu hỏi<textarea name="message" rows="4" maxlength="2000"></textarea></label></p><p><label class="check-label"><input type="checkbox" name="consent" value="true" required>Tôi đồng ý dùng thông tin trên để tư vấn lớp học.</label></p><button class="button full">Gửi yêu cầu ↗</button></form><p class="footnote">Giáo viên sẽ liên hệ để tư vấn và xác nhận đăng ký với bạn.</p></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></div><script src="/portal.js" defer></script></body></html>
