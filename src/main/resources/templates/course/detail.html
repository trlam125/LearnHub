<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Chi tiết khóa học')}"></head><body class="chinese-app"><a class="skip-link" href="#main">Đến nội dung chính</a><div class="nav-shade" id="nav-shade"></div><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div th:if="${notice}" class="messages" role="status"><div class="message success" th:text="${notice}"></div></div><main id="main"><div class="wrap section"><a class="back" href="/courses">← Tất cả khóa học</a><div class="two-col"><div><div class="overline" th:text="${course.subject}"></div><h1 class="page-title" th:text="${course.title}"></h1><p class="lead" th:text="${course.summary}"></p><div class="teacher" th:text="${course.teacherName}"></div><div class="prose preline" th:text="${course.description}"></div><h2>Nội dung khóa học</h2><section class="chapter" th:each="row:${chapters}"><h3 th:text="${row.chapter.title}"></h3><div class="lesson-row" th:each="lesson:${row.lessons}"><strong th:text="${lesson.title}"></strong><a class="pill" th:if="${access or lesson.preview}" th:href="@{/lessons/{id}(id=${lesson.id})}" th:text="${lesson.preview and !access?'Học thử ↗':'Vào học ↗'}"></a><span th:unless="${access or lesson.preview}" class="muted">Cần đăng ký</span></div></section></div><aside class="purchase panel"><div class="overline">ĐẦU TƯ CHO VIỆC HỌC</div><div class="price" th:text="${@fmt.money(course.price)}"></div><ul class="check-list"><li th:text="${course.accessDays}+' ngày truy cập'"></li><li>Tài liệu và bài tập theo bài</li><li>Lưu kết quả và tiến độ</li></ul><a th:if="${access}" class="button full" href="/my-learning">Đến góc học tập ↗</a><form th:if="${!access and me!=null}" method="post" th:action="@{/courses/{id}/buy(id=${course.id})}"><button class="button full">Đăng ký khóa học ↗</button></form><a th:if="${!access and me==null}" class="button full" href="/login">Đăng nhập để đăng ký ↗</a><small>Bằng việc mua, bạn đồng ý với <a href="/policies">điều khoản học tập</a>.</small></aside></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></div><script src="/portal.js" defer></script></body></html>
