<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Bài học theo cấp')}"></head><body class="chinese-app"><a class="skip-link" href="#main">Đến nội dung chính</a><div class="nav-shade" id="nav-shade"></div><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div th:if="${notice}" class="messages" role="status"><div class="message success" th:text="${notice}"></div></div><main id="main"><div class="portal-page"><a class="back" th:href="${languagePath}">← Lộ trình học</a><div class="level-hero"><div><div class="overline" th:text="${level.path.title}"></div><h1 th:text="${level.title}"></h1><p th:text="${level.description}"></p></div><span lang="zh">学</span></div><div class="portal-section-title"><h2>Học theo từng bài</h2><a th:href="@{/courses/{slug}(slug=${level.course.slug})}" th:text="'Quyền học · '+${@fmt.money(level.course.price)}+' →'"></a></div><div class="lesson-list"><article class="path-lesson" th:each="row,i:${rows}"><span class="lesson-index" th:text="${i.count}"></span><div><small th:text="${row.lesson.chapter.title}"></small><h3 th:text="${row.lesson.title}"></h3><p th:text="${row.words}+' từ vựng'+${row.completed?' · ✓ Đã hoàn thành':''}"></p></div><a th:if="${row.access}" class="button secondary" th:href="@{/lessons/{id}(id=${row.lesson.id})}">Vào học →</a><a th:unless="${row.access}" class="pill" th:href="@{/courses/{slug}(slug=${level.course.slug})}">Đăng ký để học →</a></article></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></div><script src="/portal.js" defer></script></body></html>
