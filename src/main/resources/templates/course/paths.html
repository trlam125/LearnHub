<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Lộ trình học')}"></head><body class="chinese-app"><a class="skip-link" href="#main">Đến nội dung chính</a><div class="nav-shade" id="nav-shade"></div><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div th:if="${notice}" class="messages" role="status"><div class="message success" th:text="${notice}"></div></div><main id="main"><div class="portal-page"><div class="page-heading"><div class="overline">TỪ NỀN TẢNG ĐẾN NÂNG CAO</div><h1 th:text="'Lộ trình học '+${languageName}"></h1><p>Chọn cấp độ, học từ vựng, ôn flashcard rồi luyện tập.</p></div><div class="tabs"><a th:href="${languagePath}">Tất cả</a><th:block th:unless="${isEnglish}"><a href="/lo-trinh?lang=zh&amp;category=hsk">HSK nền tảng</a><a href="/lo-trinh?lang=zh&amp;category=advanced">HSK 7–9</a></th:block><th:block th:if="${isEnglish}"><a href="/lo-trinh?lang=en&amp;category=cefr">A1–C2</a><a href="/lo-trinh?lang=en&amp;category=ielts">IELTS</a><a href="/lo-trinh?lang=en&amp;category=toeic">TOEIC</a></th:block></div><div class="empty" th:if="${#lists.isEmpty(rows)}">Lộ trình đang được giáo viên chuẩn bị.</div><section class="portal-section" th:each="row:${rows}"><div class="path-intro"><span class="path-symbol" th:text="${row.path.symbol}"></span><div><h2 th:text="${row.path.title}"></h2><p th:text="${row.path.description}"></p></div></div><div class="level-grid"><article class="level-card" th:each="card:${row.levels}"><span class="level-number" th:text="${card.level.number}"></span><h3 th:text="${card.level.title}"></h3><p th:text="${card.level.description}"></p><th:block th:if="${card.level.published and card.level.course!=null and card.level.course.published}"><div class="level-meta"><span th:text="${card.lessons}+' bài đã đăng'"></span><span th:text="${card.words}+' từ đã đăng'"></span></div><a class="button secondary full" th:href="@{/lo-trinh/levels/{id}(id=${card.level.id})}">Bắt đầu học →</a></th:block><span class="pill" th:if="${!card.level.published}">Đang biên soạn</span></article></div></section><p class="footnote">Chọn cấp độ phù hợp và bắt đầu từ những bài học đã mở.</p></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></div><script src="/portal.js" defer></script></body></html>
