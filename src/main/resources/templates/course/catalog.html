<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Khóa học')}"></head><body class="chinese-app"><a class="skip-link" href="#main">Đến nội dung chính</a><div class="nav-shade" id="nav-shade"></div><aside th:replace="~{fragments/layout :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/layout :: topbar}"></header><div th:if="${notice}" class="messages" role="status"><div class="message success" th:text="${notice}"></div></div><main id="main"><div class="portal-page"><div class="page-heading heading-with-action"><div><div class="overline">CHỌN ĐIỂM BẮT ĐẦU</div><h1>Khóa học dành cho bạn</h1></div><form class="search" method="get" action="/courses"><input type="hidden" name="lang" th:value="${languageCode}"><input name="q" th:value="${query}" placeholder="Tên khóa hoặc môn học…" aria-label="Tìm khóa học"><button aria-label="Tìm kiếm">⌕</button></form></div><div class="course-grid"><article class="course-card" th:each="course:${courses}"><a class="course-cover cover-green" th:href="@{/courses/{slug}(slug=${course.slug})}"><span class="subject" th:text="${course.subject}"></span><span class="cover-symbol" lang="zh">学</span></a><div class="course-info"><div class="course-meta" th:text="${course.accessDays}+' ngày truy cập'"></div><h3><a th:href="@{/courses/{slug}(slug=${course.slug})}" th:text="${course.title}"></a></h3><p th:text="${course.summary}"></p><div class="teacher" th:text="${course.teacherName}"></div><div class="course-bottom"><strong th:text="${@fmt.money(course.price)}"></strong><a th:href="@{/courses/{slug}(slug=${course.slug})}">Xem khóa học ↗</a></div></div></article><div class="empty" th:if="${#lists.isEmpty(courses)}">Chưa có khóa học phù hợp.</div></div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></div><script src="/portal.js" defer></script></body></html>
