spring:
  application:
    name: learnhub-chinese
  profiles:
    active: ${APP_PROFILE:dev}
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/learnhub?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:learnhub}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  task:
    scheduling:
      pool:
        size: 2
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/mysql}
  servlet:
    multipart:
      max-file-size: 1000000B
      max-request-size: 2MB
  thymeleaf:
    cache: ${TEMPLATE_CACHE:false}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_TLS:true}
          connectiontimeout: 5000
          timeout: 15000
          writetimeout: 15000
server:
  port: ${PORT:8080}
  address: ${BIND_ADDRESS:127.0.0.1}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        secure: ${SECURE_COOKIES:false}
        same-site: lax
app:
  base-url: ${SITE_URL:http://localhost:8080}
  storage: ${PRIVATE_MEDIA_ROOT:./private-media}
  seed-demo: ${SEED_DEMO:false}
  bootstrap-email: ${ADMIN_EMAIL:}
  bootstrap-password: ${ADMIN_PASSWORD:}
  mail-mode: ${MAIL_MODE:console}
  from-email: ${FROM_EMAIL:no-reply@example.com}
  support-email: ${SUPPORT_EMAIL:support@example.com}
  payment-mode: ${PAYMENT_MODE:manual}
  bank-name: ${BANK_NAME:}
  bank-account: ${BANK_ACCOUNT:}
  bank-owner: ${BANK_OWNER:}
  payos-client-id: ${PAYOS_CLIENT_ID:}
  payos-api-key: ${PAYOS_API_KEY:}
  payos-checksum-key: ${PAYOS_CHECKSUM_KEY:}
  jobs-enabled: ${JOBS_ENABLED:true}
