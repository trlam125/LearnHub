services:
  app:
    environment:
      APP_PROFILE: prod
      SECURE_COOKIES: 'true'
      SEED_DEMO: 'false'
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
