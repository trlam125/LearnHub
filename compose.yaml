name: learnhub-spring
services:
  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin", "--default-time-zone=+00:00"]
    environment:
      MYSQL_DATABASE: learnhub
      MYSQL_USER: learnhub
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u"$$MYSQL_USER" -D"$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://db:3306/learnhub?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USER: learnhub
      FLYWAY_LOCATIONS: classpath:db/mysql
      BIND_ADDRESS: 0.0.0.0
      PRIVATE_MEDIA_ROOT: /app/private-media
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - private_media:/app/private-media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql_database:
  private_media:
